image: Visual Studio 2022

environment:
  nodejs_version: "20"
  CI: "true"

install:
  - ps: Install-Product node $env:nodejs_version
  - ps: |
      $rustupArgs = "-y"
      Invoke-WebRequest -Uri "https://win.rustup.rs" -OutFile "rustup-init.exe"
      Start-Process -FilePath "rustup-init.exe" -ArgumentList "-y" -Wait
  - set PATH=%USERPROFILE%\.cargo\bin;%PATH%
  - npm install -g pnpm
  - ps: |
      $pkgPath = "package.json"
      $pkg = Get-Content $pkgPath | ConvertFrom-Json
      if (-not $pkg.pnpm) { $pkg | Add-Member -NotePropertyName "pnpm" -NotePropertyValue @{} }
      $pkg.pnpm | Add-Member -NotePropertyName "onlyBuiltDependencies" -NotePropertyValue @("*") -Force
      $pkg | ConvertTo-Json -Depth 10 | Set-Content $pkgPath
  - pnpm install --no-frozen-lockfile --unsafe-perm

build_script:
  - pnpm run tauri build

artifacts:
  - path: src-tauri\target\release\bundle\nsis\*.exe
    name: KalendarzInstaller
